    <script>
        // OPERADORS DE COMPARACIÓ ---------------

        // Igualtat (valor)
        5 == 5; // true
        5 == "5"; // true (conversió de tipus)

        // Igualtat estricta (valor i tipus)
        5 === 5; // true
        5 === "5"; // false (tipus diferent)

        // Desigualtat
        5 != 10; // true
        5 !== "5"; // true (tipus diferent)

        // Major que / Major o igual
        10 > 5; // true
        10 >= 10; // true

        // Menor que / Menor o igual
        5 < 10; // true
        5 <= 5; // true

        // OPERADORS LÒGICS ---------------
        
        //AND (i) - ambdoues condicions han de ser certes
        true && true; // true
        true && false; // false

        // OR (o) - almenys una condició ha de ser certa
        true || false; //true
        false || false; //false
        
        // NOT (no) - inverteix el valor
        !true; //false
        !false; //true

        // ------- EXEMPLE -------------

        let edat = 18;
        let tePermis = true;

        //L'usuari pot conduir si té 18 o més I té permís
        edat >= 18 && tePermis; //true
        //L'usuari pot entrar si és major d'edat O té permís dels pares
        edat >= 18 || tePermis; // true
    </script>

    <script>
        // BUCLES FOR -----------------------------

        //(SINTAXI BASICA) 
        // for(inicialització;condició; increment) {
        //     //Codi que es repeteix
        // }

        for(let i=1;i<=5;i=i+1){ // Començem a 1, repetim mentre i sigui
            console.log(i); //Mostrem el valor actual de i a la consola
        }

        for(let i=0;i<5;i=i+1){ // Comencem a 0 i repetim fins a 4
            console.log("Iteració número: "+i); //Mostrem el número d'iteració
        }

        for(let i=0;i<10;i=i+2){ // Incrementem de 2 en 2 (0,2,4...)
            console.log(i); //Mostrem cada valor
        }

        for(let i =5;i>=1;i=i-1){ // Comencem a 5 i restem 1 cada volta fins a arribar a 1
            console.log(i); //Mostrem el valor actual
        }
    </script>

    <script>
        // BUCLES WHILE ---------------------------
        //(SINTAXI BASICA) 
        // while(condició) {
        //     //Codi que es repeteix
        // }

        let i = 1; //Variable de control del bucle
        while (i <=5) { // Mentre i sigui menor o igual a 5...
            console.log(i) //Mostrem i
            i = i + 1; // I després incrementa pero no quedar-se en un bucle infinit
        } 

        let comptador = 0; // Inicialitzem el comptador
        while (comptador < 3){
            console.log("Comptador: "+comptador)
            comptador = comptador + 1;  //Incrementem el comptador
        }
    </script>

    <script>
        // BUCLES Do..WHILE ---------------------------
        //(SINTAXI BASICA) 
        // do {
        //     //Codi que es repeteix
        // } while (condició);

        let valor; //Declarem la variable on guardarem el valor introduït
        do{
            valor = prompt("Introdueix un número major que 5:") //demanem un valor a l'usuari
            valor = Number(valor); // El convertim a número
        } while (valor <=5 ) //Si és 5 o menys, tornem a preguntar

        console.log("Has introduït: "+valor); //Quan sigui vàlid ho mostrara
    </script>
