<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen prueba </title>
    <style>
        .green{
            background-color: green;
        }
        .yellow{
            background-color: yellow;
        }
        .red{
            background-color: red;
        }

        .div{
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }

    </style>
</head>
<body>
    <h1>Examen</h1>
    <div>
        <h2>Ejercicio 1</h2>
        <label>Nombre</label>
        <input class="nombre" type="text">
        <label>Apellido</label>
        <input class="apellido" type="text">
        <button class="button">Enviar</button>    
    </div>
    <div>
        <h2>Ejercicio 2</h2>
        <div class="green div" id="div">
        <button id="red">Red</button>
        <button id="yellow">Yellow</button>
        <button id="green">Green</button>         
    </div>
    <div>
        <h2>Ejercicio 3</h3>
        <input type="number" id="primert">
        <input type="number" id="segunt">
        <input type="number" id="tercert">
        <button class="enviar">enviar</button>
        <div id="div1">        
    </div>
    <script>
        let nombre = document.querySelector(".nombre")
        let apellido = document.querySelector(".apellido")
        let boton = document.querySelector(".button")
        function clickb(){
            console.log("¡Buenos dias "+nombre.value+" "+apellido.value)
        }
        boton.addEventListener("click",clickb)
    </script>
        <script>
        let div = document.querySelector("#div")
        let red = document.querySelector("#red")
        let yellow = document.querySelector("#yellow")
        let green = document.querySelector("#green")
        console.log(green)
        function rojo(){
            if (div.classList.contains = "green"){
                div.classList.remove("green")
                div.classList.add("red")
            } else if (div.classList.contains = "yellow"){
                div.classList.remove("yellow")
                div.classList.add("red")
            }
        }
        function amarillo(){
            if (div.classList.contains = "green"){
                div.classList.remove("green")
                div.classList.add("yellow")
            } 
            if (div.classList.contains = "red"){
                div.classList.remove("red")
                div.classList.add("yellow")
            }
        }
        function verde(){
            if (div.classList.contains = "red"){
                div.classList.remove("red")
                div.classList.add("green")
            } 
            if (div.classList.contains = "yellow"){
                div.classList.remove("yellow")
                div.classList.add("green")
            }
        }
        red.addEventListener("click",rojo)
        yellow.addEventListener("click",amarillo)
        green.addEventListener("click",verde)
    </script>
    <script>
        let pt = document.querySelector("#primert")
        let st = document.querySelector("#segunt")
        let tt = document.querySelector("#tercert")
        let boton1 = document.querySelector(".enviar")
        let div1 = document.querySelector("#div1")
        function media(){
            console.log(pt.value)
            console.log(st.value)
            console.log(tt.value)
            div1.innerHTML=(Number(pt.value)+Number(st.value)+Number(tt.value))/3
            if (pt.value < 5){
                div1.innerHTML = "Hay que aprobar los 3 trimestres"
            }
            if (st.value < 5){
                div1.innerHTML = "Hay que aprobar los 3 trimestres"
            }
            if (tt.value < 5){
                div1.innerHTML = "Hay que aprobar los 3 trimestres"
            }
        }
        boton1.addEventListener("click",media)
    </script>
</body>
</html>
