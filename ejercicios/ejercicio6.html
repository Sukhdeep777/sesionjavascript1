<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego</title>
    <style>
        .body {
            width: 100%;
            height: 100%;
        }

        main {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .cuadro {
            border: 1px solid #000;
            width: 600px;
            height: 300px;
            position: relative;
            background-color: #000;
        }

        .coche {
            width: 50px;
            height: 60px;
            position: absolute;
            bottom: 0px;
            background-size: cover;
            object-fit: cover;
        }

        .coche img{
            width: 100%;
        }

    </style>
</head>

<body>
    <main>
        <div class="cuadro">
            <div class="coche">
                <img src="https://media.tenor.com/yzVsTWVKKmYAAAAj/pacman.gif" alt="">
            </div>
        </div>
    </main>
    <script>
        // SELECCIONAMOS LOS DIV
        let cuadro = document.querySelector(".cuadro")
        let coche = document.querySelector(".coche")
        console.log(cuadro)
        let X = 0 // Horizontal 
        let Y = 0 // Vertical
        console.log(cuadro.clientWidth) // Con clientWidth podemos ver el tamaño del cuadro y cambiandolo por Height vemos la altura
        console.log(cuadro.clientHeight)
        console.log(coche.offsetHeight) // Podemos ver el Ancho y la altura del div con la clase coche
        console.log(coche.offsetWidth)
        // El clientWidth = Mide el espacio que hay dentro del elemento ( Cuenta de espacio todo menos el scroll y el borde )
        // offsetWidth = Cuanto espacio ocupa (Cuenta de espacio todo )
        function mover(event) {
            // ASIGNAR EL TAMAÑO ( COCHE Y CUADRO)
            anchocuadro = cuadro.clientWidth
            alturacuadro = cuadro.clientHeight
            anchocoche = coche.offsetWidth
            alturacoche = coche.offsetHeight

            //  TECLAS DE MOVIMIENTO
            if (event.key == "a") { // Tecla A
                coche.style.left = X = X + -5 // Restamos cada vez 5
            }
            if (event.key == "d") { // Tecla D
                coche.style.left = X = X + 5 // Sumamos cada vez 5
            }
            if (event.key == "w") { // Tecla W
                coche.style.bottom = Y = Y + 5
            }
            if (event.key == "s") { // Tecla S
                coche.style.bottom = Y = Y + -5
            }
            // BORDES
            if (X > anchocuadro) { // Si toca la esquina derehca lo que ara es mandar a 0 pero restandole el propio valor del coche haciendo que este fuera del cuado, asi lo hacemos como si fuera un pacman.
                X = -anchocoche
            }
            if (X < -anchocoche) { // Si se pasa mas de -30px lo que hara es irse a la banda derecha
                X = anchocuadro
            }
            if (Y > alturacuadro) {
                Y = -alturacoche
            }
            if (Y < -alturacoche) {
                Y = alturacuadro
            }
            // LO PONEMOS FINAL PARA QUE NO SE INTERCEPTE ENTRE EL CALCULO DE LOS BORDES
            coche.style.left = X + "px"
            coche.style.bottom = Y + "px"
        }
        window.addEventListener("keydown", mover) //Keydown para que el teclado se pueda ejecutar
    </script>
</body>

</html>>
